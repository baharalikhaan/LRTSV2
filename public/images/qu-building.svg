<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" fill="none">
  <!-- Line illustration mimicking sample.jpg — Qatar University's iconic
       modular campus: clustered cubic towers, circular lattice rose windows,
       pyramidal tiled roofs. Sand-white lines with gold accents. -->

  <defs>
    <!-- Reusable rose window in pure line style -->
    <g id="rose" fill="none" stroke="#faf7f0" stroke-width="3">
      <circle r="100"/>
      <circle r="91" stroke="#e3b04b" stroke-width="3.5"/>
      <circle r="80" stroke-opacity=".85"/>
      <!-- hexagram lattice -->
      <path d="M0,-72 L62.35,36 L-62.35,36 Z" stroke-opacity=".9"/>
      <path d="M0,72 L62.35,-36 L-62.35,-36 Z" stroke-opacity=".9"/>
      <!-- rotated inner hexagon -->
      <path d="M9.8,-36.7 L36.7,-9.8 L26.9,26.9 L-9.8,36.7 L-36.7,9.8 L-26.9,-26.9 Z" stroke-opacity=".7" stroke-width="2.5"/>
      <!-- radial spokes -->
      <g stroke-opacity=".5" stroke-width="2">
        <line x1="0" y1="-91" x2="0" y2="-72"/>
        <line x1="45.5" y1="-78.8" x2="35.1" y2="-62.4"/>
        <line x1="78.8" y1="-45.5" x2="62.4" y2="-35.1"/>
        <line x1="91" y1="0" x2="72" y2="0"/>
        <line x1="78.8" y1="45.5" x2="62.4" y2="35.1"/>
        <line x1="45.5" y1="78.8" x2="35.1" y2="62.4"/>
        <line x1="0" y1="91" x2="0" y2="72"/>
        <line x1="-45.5" y1="78.8" x2="-35.1" y2="62.4"/>
        <line x1="-78.8" y1="45.5" x2="-62.4" y2="35.1"/>
        <line x1="-91" y1="0" x2="-72" y2="0"/>
        <line x1="-78.8" y1="-45.5" x2="-62.4" y2="-35.1"/>
        <line x1="-45.5" y1="-78.8" x2="-35.1" y2="-62.4"/>
      </g>
      <circle r="8" fill="#e3b04b" stroke="none"/>
    </g>
  </defs>

  <!-- ══════════ GROUND ══════════ -->
  <line x1="16" y1="520" x2="904" y2="520" stroke="#faf7f0" stroke-width="3" stroke-opacity=".45"/>
  <line x1="56" y1="536" x2="864" y2="536" stroke="#faf7f0" stroke-width="2.5" stroke-opacity=".2"/>

  <!-- ══════════ LARGE PYRAMID ROOF (behind cubes) ══════════ -->
  <g stroke="#faf7f0" stroke-width="2.5" opacity=".6">
    <path d="M540 236 L680 436 L400 436 Z"/>
    <line x1="495" y1="300" x2="585" y2="300"/>
    <line x1="467" y1="340" x2="613" y2="340"/>
    <line x1="439" y1="380" x2="641" y2="380"/>
    <line x1="411" y1="420" x2="669" y2="420"/>
    <line x1="505" y1="300" x2="505" y2="420"/>
    <line x1="540" y1="260" x2="540" y2="420"/>
    <line x1="575" y1="300" x2="575" y2="420"/>
  </g>

  <!-- ══════════ CUBIC TOWERS ══════════ -->
  <g stroke="#faf7f0" stroke-width="3" opacity="0.9">
    <!-- A — tall left -->
    <rect x="48" y="176" width="204" height="344"/>
    <line x1="38" y1="176" x2="262" y2="176" stroke-width="4"/>
    <!-- B -->
    <rect x="252" y="258" width="164" height="262"/>
    <line x1="243" y1="258" x2="425" y2="258" stroke-width="4"/>
    <!-- C — small -->
    <rect x="416" y="330" width="112" height="190"/>
    <line x1="408" y1="330" x2="536" y2="330" stroke-width="4"/>
    <!-- D — tallest, center-right -->
    <rect x="556" y="148" width="208" height="372"/>
    <line x1="546" y1="148" x2="774" y2="148" stroke-width="4"/>
    <!-- E — right lower -->
    <rect x="764" y="296" width="144" height="224"/>
    <line x1="756" y1="296" x2="916" y2="296" stroke-width="4"/>
  </g>

  <!-- ══════════ SMALL FRONT PYRAMID ══════════ -->
  <g stroke="#faf7f0" stroke-width="2.5" opacity=".65">
    <path d="M540 392 L615 470 L465 470 Z"/>
    <line x1="513" y1="420" x2="567" y2="420"/>
    <line x1="489" y1="445" x2="591" y2="445"/>
    <line x1="540" y1="404" x2="540" y2="470"/>
    <line x1="521" y1="420" x2="521" y2="470"/>
    <line x1="559" y1="420" x2="559" y2="470"/>
  </g>

  <!-- ══════════ FRONT CUBES ══════════ -->
  <g stroke="#faf7f0" stroke-width="3" opacity="0.9">
    <rect x="140" y="436" width="260" height="84"/>
    <line x1="131" y1="436" x2="409" y2="436" stroke-width="4"/>
    <rect x="590" y="452" width="240" height="68"/>
    <line x1="581" y1="452" x2="839" y2="452" stroke-width="4"/>
  </g>

  <!-- ══════════ ROSE WINDOWS ══════════ -->
  <use href="#rose" transform="translate(150 308) scale(0.84)"/>
  <use href="#rose" transform="translate(334 352) scale(0.62)"/>
  <use href="#rose" transform="translate(472 400) scale(0.42)"/>
  <use href="#rose" transform="translate(660 268) scale(0.86)"/>
  <use href="#rose" transform="translate(836 388) scale(0.56)"/>
  <use href="#rose" transform="translate(270 478) scale(0.36)"/>
  <use href="#rose" transform="translate(710 486) scale(0.28)"/>

  <!-- ══════════ FOREGROUND ══════════ -->
  <!-- palm -->
  <g stroke="#faf7f0" stroke-width="2.5" opacity=".6" fill="none">
    <path d="M40 520 C38 470 42 440 46 416"/>
    <path d="M46 416 C30 404 20 404 10 410 M46 416 C44 398 38 390 28 386 M46 416 C50 398 58 392 68 390 M46 416 C60 406 72 406 82 412"/>
  </g>
  <!-- birds -->
  <g stroke="#faf7f0" stroke-width="2" opacity=".5" fill="none">
    <path d="M300 118 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M812 166 q9 -9 18 0 q9 -9 18 0"/>
  </g>
</svg>
